<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Workbench example</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">WORKBENCH EXAMPLE</p>
      <h1>A space for your notes</h1>
      <p class="description">This page shares Kerminal’s theme and saves its state with the current view.</p>
      <label for="note">Tab note</label>
      <textarea id="note" rows="6" maxlength="512" placeholder="Write a short note…" disabled></textarea>
      <div class="actions"><button id="save" disabled>Save note</button><button id="confirm" class="secondary" disabled>Open confirmation</button><button id="recover" class="secondary" disabled>Check save</button></div>
      <p id="status" role="status" aria-live="polite">Connecting to Kerminal…</p>
    </main>
  </body>
</html>
