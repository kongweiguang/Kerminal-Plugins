# @author kongweiguang
name: Validate marketplace v1
on:
  pull_request:
    paths: ['plugins/**', 'categories.toml', 'marketplace/catalog-v1.py', 'marketplace/media_v1.py', 'marketplace/publication_v1.py', 'marketplace/tests/**', '.github/workflows/catalog-v1-validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registrations and tests
        run: |
          python marketplace/catalog-v1.py --metadata-only
          python -m unittest discover -s marketplace/tests -p 'test_catalog_v1.py'
      - name: Detect published entries
        id: entries
        run: |
          python - <<'PY'
          import importlib.util, os, sys
          sys.path.insert(0, 'marketplace')
          spec = importlib.util.spec_from_file_location('catalog', 'marketplace/catalog-v1.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          published = any(entry.get('status', 'published') == 'published' for _, entry in module.load_registrations(module.ROOT))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('published=' + str(published).lower(), file=output)
          PY
      - name: Validate pinned SDK ref
        if: steps.entries.outputs.published == 'true'
        env:
          SDK_REF: ${{ vars.KERMINAL_SDK_REF }}
        run: |
          [[ "$SDK_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'KERMINAL_SDK_REF must be a full SDK commit' >&2; exit 1; }
      - uses: actions/checkout@v4
        if: steps.entries.outputs.published == 'true'
        with:
          repository: kongweiguang/Kerminal
          ref: ${{ vars.KERMINAL_SDK_REF }}
          path: sdk-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: steps.entries.outputs.published == 'true'
      - name: Build official validator and install minisign
        if: steps.entries.outputs.published == 'true'
        run: |
          cargo install --locked --path sdk-source/sdk/cli --root "$RUNNER_TEMP/tool"
          sudo apt-get update && sudo apt-get install -y minisign
      - name: Download and validate every published asset
        if: steps.entries.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ vars.KERMINAL_CATALOG_BOOTSTRAP }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/catalog-check"
          cd "$RUNNER_TEMP/catalog-check"
          gh release list --repo kongweiguang/Kerminal-Plugins --limit 1000 --json tagName > releases.json
          if python -c 'import json,sys; sys.exit(0 if any(x["tagName"] == "catalog-v1" for x in json.load(open("releases.json"))) else 1)'; then
            gh release download catalog-v1 --repo kongweiguang/Kerminal-Plugins --pattern 'catalog.json*' --dir previous
            minisign -Vm previous/catalog.json -x previous/catalog.json.minisig -p "$GITHUB_WORKSPACE/catalog/publisher.pub"
            sequence=$(python "$GITHUB_WORKSPACE/marketplace/publication_v1.py" --releases releases.json --fixed previous/catalog.json)
            fixed_exists=true
          else
            bootstrap_arg=()
            [[ "$BOOTSTRAP" != true ]] || bootstrap_arg=(--bootstrap)
            sequence=$(python "$GITHUB_WORKSPACE/marketplace/publication_v1.py" --releases releases.json "${bootstrap_arg[@]}")
            fixed_exists=false
          fi
          python "$GITHUB_WORKSPACE/marketplace/catalog-v1.py" --tool "$RUNNER_TEMP/tool/bin/kerminal-plugin" --sequence "$sequence" --output catalog.json --media-dir media
          if [[ "$fixed_exists" == true ]]; then
            python "$GITHUB_WORKSPACE/marketplace/publication_v1.py" --releases releases.json --fixed previous/catalog.json --candidate catalog.json
          fi
